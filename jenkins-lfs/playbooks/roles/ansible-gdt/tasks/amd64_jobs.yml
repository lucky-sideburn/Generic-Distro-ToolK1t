- name: "Include conf.yml tasks"
  include_tasks: conf.yml
  tags: system_configuration

- name: Print that is building amd64 jobs
  ansible.builtin.debug:
    msg: "Building AMD64 jobs"

- name: "Create Jenkins Folder (amd64)"
  ansible.builtin.uri:
    url: "{{ jenkins_url }}/createItem?name={{ item | urlencode }}" 
    method: POST
    user: "{{ jenkins_user }}"
    password: "{{ jenkins_token }}"
    force_basic_auth: yes
    status_code: [200, 302]
    headers:
      Content-Type: "application/xml"
    body: |
      <?xml version='1.1' encoding='UTF-8'?>
      <com.cloudbees.hudson.plugins.folder.Folder plugin="cloudbees-folder@6.1012.v79a_86a_1ea_c1f">
        <description></description>
        <properties/>
        <folderViews class="com.cloudbees.hudson.plugins.folder.views.DefaultFolderViewHolder">
          <views>
            <hudson.model.AllView>
              <owner class="com.cloudbees.hudson.plugins.folder.Folder" reference="../../../.."/>
              <name>All</name>
              <filterExecutors>false</filterExecutors>
              <filterQueue>false</filterQueue>
              <properties class="hudson.model.View$PropertyList"/>
            </hudson.model.AllView>
          </views>
          <tabBar class="hudson.views.DefaultViewsTabBar"/>
        </folderViews>
        <healthMetrics/>
        <icon class="com.cloudbees.hudson.plugins.folder.icons.StockFolderIcon"/>
      </com.cloudbees.hudson.plugins.folder.Folder>
    body_format: raw
    timeout: 60
  loop: "{{ jenkins_jobs.amd64_folders }}"
  ignore_errors: yes
  tags:
    - amd64_folders
    - amd64_jobs
  
# CROSS TOOLCHAIN
- name: "Upsert Jenkins Jobs - Cross Toolchain Jobs (amd64) - update"
  ansible.builtin.uri:
    url: "{{ jenkins_url }}/job/2.1%20-%20amd64_cross_toolchain/job/{{ item.name | urlencode }}/config.xml"
    method: POST
    user: "{{ jenkins_user }}"
    password: "{{ jenkins_token }}"
    force_basic_auth: yes
    status_code: [200, 302, 404]
    headers:
      Content-Type: "application/xml"
    body: |
      <project>
        <actions/>
        <description>Jenkins job to execute a shell command</description>
        <keepDependencies>false</keepDependencies>
        <properties/>
        <scm class="hudson.scm.NullSCM"/>
        <canRoam>true</canRoam>
        <assignedNode>amd64</assignedNode>
        <disabled>false</disabled>
        <blockBuildWhenDownstreamBuilding>false</blockBuildWhenDownstreamBuilding>
        <blockBuildWhenUpstreamBuilding>false</blockBuildWhenUpstreamBuilding>
        <triggers/>
        <concurrentBuild>false</concurrentBuild>
        <builders>
          <hudson.tasks.Shell>
            <command>{{ amd64_common_build_start_command }}
              export BUILD_MODE=host_libvirt
              if [ "$(basename {{ item.source_dir }})" != "sources" ]; then
                if [ -d {{ item.source_dir | basename }} ]; then
                  sudo rm -rf {{ item.source_dir | basename }}
                fi
                if [ -n "{{ item.git_url | default('') }}" ]; then
                  git clone {{ item.git_url | default('') }} {{ item.source_dir | basename }}
                  cd "{{ item.source_dir | basename }}"
                  git checkout {{ item.git_branch | default('main') }}
                elif [ "{{ item.archive_file | string | lower }}" != "false" ] &amp;&amp; [ -n "{{ item.archive_file | string }}" ]; then
                  if [ ! -f "{{ (item.archive_file | string) | basename }}" ]; then
                    if echo "{{ item.archive_file | string }}" | grep -Eq "^https?://"; then
                      curl -fL "{{ item.archive_file | string }}" -o "{{ (item.archive_file | string) | basename }}"
                    elif [ -n "{{ lfs_repo_url | default('') }}" ]; then
                      curl -fL "{{ lfs_repo_url | default('') }}/{{ (item.archive_file | string) | basename }}" -o "{{ (item.archive_file | string) | basename }}"
                    fi
                  fi
                  tar -xvf {{ (item.archive_file | string) | basename }}
                  cd "{{ item.source_dir | basename }}"
                else
                  cd "{{ item.source_dir | basename }}"
                fi
              fi
              
              pwd

              {{ item.build_command }}
            </command>
          </hudson.tasks.Shell>
        </builders>
        <publishers/>
        <buildWrappers/>
      </project>
    body_format: raw
    timeout: 60
  register: amd64_cross_toolchain_upd
  loop: "{{ jenkins_jobs.cross_toolchain }}"
  loop_control:
    index_var: loop_idx
  failed_when: false
  tags:
    - amd64_cross_toolchain
    - amd64_jobs

