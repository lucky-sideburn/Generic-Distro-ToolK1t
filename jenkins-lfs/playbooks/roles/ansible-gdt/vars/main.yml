    - name: 0001 - acl (EL9 Packages)
      version: 2.3.1
      archive_file: ""
      source_dir: /sources
      source_repo: https://gitlab.com/redhat/centos-stream/rpms/acl.git
      description: |
        Build acl from CentOS Stream RPM sources and install resulting RPM artifacts.
      category:
        This job compiles source from CentOS Stream RPM git and installs rebuilt EL9 artifacts for acl.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          set -e
          mkdir -p /sources/centos-stream-rpms
          cd /sources/centos-stream-rpms
          dnf install -y git rpm-build rpmdevtools dnf-plugins-core
          if [ ! -d acl ]; then
            git clone --depth 1 https://gitlab.com/redhat/centos-stream/rpms/acl.git
          else
            git -C acl pull --ff-only
          fi
          SPEC_FILE=$(find acl -type f -name "*.spec" | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: no spec file found for acl"
            exit 1
          fi
          spectool -g -R "$SPEC_FILE"
          dnf builddep -y "$SPEC_FILE"
          rpmbuild -ba "$SPEC_FILE"
          RPMS=$(find /root/rpmbuild/RPMS -type f -name "*.rpm" ! -name "*debuginfo*" ! -name "*debugsource*")
          if [ -z "$RPMS" ]; then
            echo "ERROR: rpmbuild produced no installable RPMs for acl"
            exit 1
          fi
          dnf install -y $RPMS
        '

