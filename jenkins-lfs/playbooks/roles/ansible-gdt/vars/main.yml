---
# vars file for ansible-gdt
build_tool: true
jenkins_url: https://jenkins.garantideltalento.it
jenkins_user: admin

lfs_packages:
  - binutils
  - bash
  - bison
  - diffutils
  - findutils
  - gawk
  - gcc
  - g++
  - grep
  - gzip
  - m4
  - make
  - patch
  - perl
  - python3
  - sed
  - tar
  - coreutils
  - xz-utils
  - texinfo
  - libgmp-dev
  - build-essential
  - autoconf
  - pkg-config
  - gettext
  - libtool
  - asciidoctor
  - libkmod-dev 
  - kmod

lfs_extra_archives:
  - mpfr-4.2.1.tar.xz
  - gmp-6.3.0.tar.xz
  - mpc-1.3.1.tar.gz
  - udev-lfs-20230818.tar.xz
  - systemd-man-pages-257.3.tar.xz
  - lfs-bootscripts-20240825.tar.xz

chroot_start_command: |-
  if ! mountpoint -q $LFS/dev; then
  sudo mount -v --bind /dev $LFS/dev
  fi

  if ! mountpoint -q $LFS/dev/pts; then
    sudo mount -vt devpts devpts -o gid=5,mode=0620 $LFS/dev/pts
  fi

  if ! mountpoint -q $LFS/proc; then
    sudo mount -vt proc proc $LFS/proc
  fi

  if ! mountpoint -q $LFS/sys; then
    sudo mount -vt sysfs sysfs $LFS/sys
  fi

  if ! mountpoint -q $LFS/run; then
    sudo mount -vt tmpfs tmpfs $LFS/run
  fi

  sudo chroot "$LFS" /usr/bin/env -i   \
      HOME=/root                       \
      TERM="$TERM"                     \
      PS1='(lfs chroot) \u:\w\$ '      \
      PATH=/usr/local/bin:/usr/bin:/usr/sbin \
      MAKEFLAGS="-j$(nproc)"           \
      TESTSUITEFLAGS="-j$(nproc)"      \
      /bin/bash

amd64_common_build_start_command: |-
  echo "  DevOpsTribe Linux - Powered by DevOpsTribe.it and GarantiDelTalento.it"
  echo "  LFS 12.3 Build System"
  echo "Current Directory: $(pwd)"
  echo "Current User: $(whoami)"
  echo "Environment Variables:"
  set +h
  umask 022
  LFS=/mnt/lfs
  LC_ALL=POSIX
  LFS_TGT=$(uname -m)-lfs-linux-gnu
  
  PATH=$LFS/tools/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/bin
  CONFIG_SITE=$LFS/usr/share/config.site
  export LFS LC_ALL LFS_TGT PATH CONFIG_SITE
  export MAKEFLAGS=-j$(nproc)

  cd $LFS/sources

  # We avoid heredoc (EOF) syntax because Jenkins YAML upload
  # strips or misinterprets heredoc blocks during pipeline parsing.
  # Instead we use individual echo/printf statements for idempotency.

  sudo mkdir -p /etc/environment.d

  # Only write each variable if not already present in the file
  LFSENV=/etc/environment.d/lfs.sh
  sudo touch $LFSENV

  grep -q "^export LFS=" $LFSENV || echo "export LFS=$LFS" | sudo tee -a $LFSENV
  grep -q "^export LC_ALL=" $LFSENV || echo "export LC_ALL=$LC_ALL" | sudo tee -a $LFSENV
  grep -q "^export LFS_TGT=" $LFSENV || echo "export LFS_TGT=$LFS_TGT" | sudo tee -a $LFSENV
  grep -q "^export PATH=" $LFSENV || echo "export PATH=$PATH" | sudo tee -a $LFSENV
  grep -q "^export CONFIG_SITE=" $LFSENV || echo "export CONFIG_SITE=$CONFIG_SITE" | sudo tee -a $LFSENV
  grep -q "^export MAKEFLAGS=" $LFSENV || echo "export MAKEFLAGS=$MAKEFLAGS" | sudo tee -a $LFSENV

  # Preserve vars across sudo - idempotent
  SUDOFILE=/etc/sudoers.d/lfs
  if [ ! -f $SUDOFILE ]; then
    echo 'Defaults env_keep += "LFS LC_ALL LFS_TGT PATH CONFIG_SITE MAKEFLAGS"' | sudo tee $SUDOFILE
    echo 'Defaults secure_path="/mnt/lfs/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"' | sudo tee -a $SUDOFILE
    sudo chmod 440 $SUDOFILE
  fi

  # Verify LFS directory structure is present - exit if not initialized
  for required_dir in $LFS/etc $LFS/var $LFS/usr/bin $LFS/usr/lib $LFS/usr/sbin $LFS/bin $LFS/lib $LFS/sbin; do
    if [ ! -d "$required_dir" ]; then
      echo "ERROR: Required LFS directory $required_dir is missing. Please initialize the LFS structure first."
      exit 1
    fi
  done

  case $(uname -m) in
    x86_64)
      if [ ! -d "$LFS/lib64" ]; then
        echo "ERROR: Required LFS directory $LFS/lib64 is missing. Please initialize the LFS structure first."
        exit 1
      fi
      ;;
  esac

  echo "LFS directory structure verified OK"

  (ls $LFS/tools || (echo "Error: LFS tools directory is missing. Please initialize the LFS structure first." ; exit 1))

  JENKINS_USER=$(whoami)
  for dir in $LFS/usr $LFS/usr/bin $LFS/usr/lib $LFS/usr/sbin $LFS/var $LFS/etc $LFS/tools; do
    if [ -d "$dir" ]; then
      current_owner=$(stat -c '%U' "$dir")
      if [ "$current_owner" != "$JENKINS_USER" ]; then
        sudo chown -v $JENKINS_USER "$dir"
      fi
    fi
  done

  case $(uname -m) in
    x86_64)
      current_owner=$(stat -c '%U' "$LFS/lib64")
      if [ "$current_owner" != "$JENKINS_USER" ]; then
        sudo chown -v $JENKINS_USER "$LFS/lib64"
      fi
      ;;
  esac

  line='source /etc/environment.d/lfs.sh'

  for file in /root/.bashrc /home/ubuntu/.bashrc /root/.profile /home/ubuntu/.profile; do
    sudo touch "$file"
    if ! sudo grep -qxF "$line" "$file"; then
      echo "$line" | sudo tee -a "$file" > /dev/null
    fi
  done

  cd $LFS/sources
  env

