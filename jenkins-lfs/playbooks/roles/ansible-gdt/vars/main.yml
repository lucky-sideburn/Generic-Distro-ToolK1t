    - name: 0116A004 - rpm (Basic System Software) OPTIONAL
      version: 4.16.1.3
      archive_file: false
      git_url: https://github.com/rpm-software-management/rpm.git
      git_branch: rpm-4.16.1.3-release
      source_dir: /sources/rpm-4.16.1.3
      description: |
        RPM is a powerful package management system. This job builds librpm and
        its development headers, required by libdnf and other components that
        interact with the RPM package database.
      category:
        This job is part of the basic system software setup, specifically for building rpm.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '

          mkdir -p /usr/lib/pkgconfig

          # TODO: We should ideally generate these .pc files from the rpm build system, but for now we can just create them manually to satisfy the dependencies of libdnf and other components.
          # TODO: Understand why EOF doesn't work here, it should be possible to use it instead of multiple printf statements
          /usr/bin/printf "%s\n" \
          "prefix=/usr" \
          "exec_prefix=/usr" \
          "libdir=/usr/lib" \
          "includedir=/usr/include" \
          "" \
          "Name: Lua" \
          "Description: An embeddable scripting language" \
          "Version: 5.4.6" \
          "Libs: -L\${libdir} -llua -lm -ldl" \
          "Cflags: -I\${includedir}" \
          > /usr/lib/pkgconfig/lua.pc

          /usr/bin/printf "%s\n" \
          "prefix=/usr" \
          "exec_prefix=/usr" \
          "libdir=/usr/lib" \
          "includedir=/usr/include" \
          "" \
          "Name: bzip2" \
          "Description: A file compression library" \
          "Version: 1.0.8" \
          "Libs: -L\${libdir} -lbz2" \
          "Cflags: -I\${includedir}" \
          > /usr/lib/pkgconfig/bzip2.pc

          cd /sources/rpm-4.16.1.3
          ./autogen.sh
          ./configure --prefix=/usr \
          --sysconfdir=/etc \
          --localstatedir=/var \
          --enable-python \
          --with-crypto=openssl \
          --disable-bdb \
          --with-sqlite \
          --with-lua \
          --enable-nls \
          --disable-dependency-tracking
        
          make
          make install
          ldconfig
        '

    - name: 0116A005 - gobject-introspection (Basic System Software) OPTIONAL
      version: 1.68.0
      archive_file: https://download.gnome.org/sources/gobject-introspection/1.68/gobject-introspection-1.68.0.tar.xz
      source_dir: /sources/gobject-introspection-1.68.0
      description: |
        Build and install gobject-introspection from source in the chroot environment.
      category:
        This job is part of the basic system software setup, specifically for building gobject-introspection.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          cd /sources
          rm -rf  /sources/rocky-gobject-introspection
          git clone -b r9 --single-branch https://git.rockylinux.org/staging/rpms/gobject-introspection.git rocky-gobject-introspection
          cd /sources/gobject-introspection-1.68.0

          for p in  ../rocky-gobject-introspection/SOURCES/*.patch; do
            if [ -f "$p" ]; then
              echo "Applicazione della patch: $p"
              patch -Np1 --batch --fuzz=0 -i "$p" || { echo "Patch $p failed!"; exit 1; }
            fi
          done
          sed -i "s/^from distutils.msvccompiler import MSVCCompiler/try:\n    from distutils.msvccompiler import MSVCCompiler\nexcept ImportError:\n    class MSVCCompiler:\n        pass/" \
          giscanner/ccompiler.py
          mkdir -p build
          cd build
          export SETUPTOOLS_USE_DISTUTILS=local
   
    
          meson setup .. \
            --prefix=/usr \
            --buildtype=release \
            -Ddoctool=disabled
          ninja
          ninja install
          ldconfig
        '

