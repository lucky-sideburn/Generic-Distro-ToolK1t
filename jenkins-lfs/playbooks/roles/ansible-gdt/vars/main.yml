      build_command: |
        cd $LFS/sources
        rm -rf /mnt/lfs/sources/binutils-2.44 || echo "Removing binutils-2.44 directory failed, continuing anyway"
        tar -xvf ./binutils-2.44.tar.xz
        cd binutils-2.44
        sed '6031s/$add_dir//' -i ltmain.sh
