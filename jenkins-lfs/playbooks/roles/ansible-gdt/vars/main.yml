    - name: 0003 - Linux (System Configuration)
      version: 6.13.4
      archive_file: /sources/linux-6.13.4.tar.xz
      source_dir: /sources/linux-6.13.4
      description: |
        Linux is the kernel of the LFS system. This job builds the Linux kernel, which is essential for the LFS system to function.
      category:
        This job is part of the basic system software setup, specifically for building the Linux kernel.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          
          cd /sources/linux-6.13.4
          
          make clean

          echo "Building Kernel for $(uname -m) architecture"
          
          # TODO ARCH is not necessary
          if [ "$(uname -m)" = "x86_64" ]; then
            export ARCH=x86_64
            /bin/cp /sources/kernel_configs/kernel_config_x86_64 .config
            make -j$(nproc)
          elif [ "$(uname -m)" = "aarch64" ]; then
            export ARCH=arm64
            /bin/cp /sources/kernel_configs/kernel_config_aarch64 .config
            make -j$(nproc)
          else
            echo "Error, non-x86_64 or aarch64 architectures are not supported."
            exit 0 
          fi

          if [ -f /boot/vmlinuz-6.13.4-lfs-12.3 ]; then
            rm -f /boot/vmlinuz-6.13.4-lfs-12.3
          fi

          if [ -f /boot/System.map-6.13.4 ]; then
            rm -f /boot/System.map-6.13.4
          fi
          
          if [ -f /boot/config-6.13.4 ]; then
            rm -f /boot/config-6.13.4
          fi

          if [ -d /usr/share/doc/linux-6.13.4 ]; then
            rm -rf /usr/share/doc/linux-6.13.4
          fi
          
          if [ "$(uname -m)" = "x86_64" ]; then
            cp -iv arch/x86/boot/bzImage /boot/vmlinuz-6.13.4-lfs-12.3
            cp -iv System.map /boot/System.map-6.13.4
            cp -iv .config /boot/config-6.13.4
            cp -r Documentation -T /usr/share/doc/linux-6.13.4
          
          elif [ "$(uname -m)" = "aarch64" ]; then
            cp -iv arch/arm64/boot/Image /boot/vmlinuz-6.13.4-lfs-12.3
            cp -iv System.map /boot/System.map-6.13.4
            cp -iv .config /boot/config-6.13.4
            cp -r Documentation -T /usr/share/doc/linux-6.13.4
          fi
          make modules_install
        '

    - name: 0004 - Run Dracut to create initramfs (System Configuration)
      version: 1.0
      archive_file: /mnt/lfs/sources/empty.tar.xz
      source_dir: /mnt/lfs/sources
      description: |
        This job runs Dracut to create the initramfs for the LFS system. The initramfs is essential for booting the LFS system.
      category:
        This job is part of the operating system setup, specifically for creating the initramfs.
      build_tool: false
      build_command: echo
      exec_command: |
        {{ chroot_start_command }} -c '
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          mount -t devpts devpts /dev/pts

          LFS_KERNEL_VERSION="6.13.4" # Change to your exact version

          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          mount -t devpts devpts /dev/pts

          dracut --force \
          --kver $LFS_KERNEL_VERSION \
          --libdirs /usr/lib/dracut \
          --kmoddir /lib/modules/$LFS_KERNEL_VERSION \
          --modules "dmsquash-live bash kernel-modules rootfs-block base loop" \
          --omit "systemd multipath btrfs" \
          --filesystems "iso9660 squashfs overlay" \
          --drivers "virtio_pci virtio_blk virtio_scsi sr_mod cdrom sd_mod" \
          --no-hostonly \
          -l \
          /boot/initrd

          umount /proc || echo "Failed to unmount /proc, continuing anyway"
          umount /sys || echo "Failed to unmount /sys, continuing anyway"
          umount /dev || echo "Failed to unmount /dev, continuing anyway"
          umount /dev/pts || echo "Failed to unmount /dev/pts, continuing anyway"

          '

