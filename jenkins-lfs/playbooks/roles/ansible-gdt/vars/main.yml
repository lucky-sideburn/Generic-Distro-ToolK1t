    - name: 0004 - kubernetes (Containers)
      version: 1.33.5
      archive_file: /sources/kubernetes-1.33.5.tar.gz
      source_dir: /sources/kubernetes-1.33.5
      description: |
        Kubernetes is an open-source container orchestration platform that automates the deployment, scaling, and management of containerized applications. This job builds Kubernetes, which is essential for managing containers in the LFS environment.
      category:
        This job is part of the container setup, specifically for building Kubernetes.
      build_tool: true
      exec_command: echo
      build_command: |  
        cd /mnt/lfs/sources/kubernetes-1.33.5
        sudo GOFLAGS="-buildvcs=false" make quick-release
        sudo GOFLAGS="-buildvcs=false" make WHAT=cmd/kubeadm
        cd _output/release-stage/server/linux-amd64/kubernetes/server/bin
        sudo /bin/cp kubeadm kube-apiserver kube-controller-manager kube-scheduler kube-proxy kubectl kubelet /mnt/lfs/usr/local/bin/
          
    - name: 0005 - kubernetes-setup (Containers)
      version: 1.33
      archive_file: /sources/kubernetes
      source_dir: /sources/kubernetes
      description: |
        Kubernetes is an open-source container orchestration platform that automates the deployment, scaling, and management of containerized applications. This job builds Kubernetes, which is essential for managing containers in the LFS environment.
      category:
        This job is part of the container setup, specifically for building Kubernetes.
      build_tool: true
      exec_command: echo
      build_command: |  
        cd /tmp/

        # service account
        openssl genrsa -out service-account-key.pem 4096
        openssl req -new -x509 -days 365 -key service-account-key.pem -subj "/CN=test" -sha256 -out service-account.pem

        # api-server
        openssl genrsa -out ca.key 2048
        openssl req -x509 -new -nodes -key ca.key -subj "/CN=test" -days 10000 -out ca.crt
        openssl genrsa -out server.key 2048
        openssl req -new -key server.key -out server.csr -config fake-csr.conf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out server.crt -days 10000 \
            -extensions v3_ext -extfile fake-csr.conf

        /bin/cp service-account-key.pem ca.crt ca.key server.crt server.key  /mnt/lfs/sources/
        
        cd /mnt/lfs/sources/kubernetes

        {{ chroot_start_command }} -c '
          
          cd /sources
          [ -d /etc/kubernetes ] || mkdir /etc/kubernetes
          [ -d /etc/kubernetes/certs ] || mkdir /etc/kubernetes/certs
          [ -d /etc/kubernetes/manifests ] || mkdir /etc/kubernetes/manifests    
          /bin/cp ca.crt ca.key server.crt server.key service-account-key.pem /etc/kubernetes/certs

          cd /etc/kubernetes/certs

          export PATH="$PATH:/usr/local/bin"
          
          # kubeconfig
          kubectl config set-cluster local-apiserver \
          --certificate-authority=ca.crt \
          --embed-certs=true \
          --server=https://127.0.0.1:6443 \
          --kubeconfig=kubeconfig

          kubectl config set-credentials admin \
          --client-certificate=server.crt \
          --client-key=server.key \
          --embed-certs=true \
          --kubeconfig=kubeconfig

          kubectl config set-context default \
          --cluster=local-apiserver \
          --user=admin \
          --kubeconfig=kubeconfig

          kubectl config use-context default --kubeconfig=kubeconfig

        '
        
  systemd_integration:
    - name: 0001 - Systemd (Systemd Integration)
      version: 257.3
      archive_file: /mnt/lfs/sources/systemd-257.3.tar.gz
      source_dir: /mnt/lfs/sources/systemd-257.3
      description: |
        Systemd is a system and service manager for Linux. This job builds the
        full systemd package as an init system, replacing SysVinit/lfs-bootscripts
        in the LFS environment.
      category:
        This job is part of the systemd integration setup, specifically for building systemd.
      exec_command: echo
      build_tool: true
      build_command: |
        if ! mountpoint -q $LFS/dev; then
          sudo mount -v --bind /dev $LFS/dev
        fi
        if ! mountpoint -q $LFS/dev/pts; then
          sudo mount -vt devpts devpts -o gid=5,mode=0620 $LFS/dev/pts
        fi
        if ! mountpoint -q $LFS/proc; then
          sudo mount -vt proc proc $LFS/proc
        fi
        if ! mountpoint -q $LFS/sys; then
          sudo mount -vt sysfs sysfs $LFS/sys
        fi
        if ! mountpoint -q $LFS/run; then
          sudo mount -vt tmpfs tmpfs $LFS/run
        fi
        cd /mnt/lfs/sources
        sudo rm -rf /mnt/lfs/sources/systemd-257.3 || echo "Removing systemd-257.3 directory failed, continuing anyway"
        tar -xvf /mnt/lfs/sources/systemd-257.3.tar.gz
        {{ chroot_start_command }} -c '
          cd /sources/systemd-257.3
          sed -i -e "s/GROUP=\"render\"/GROUP=\"video\"/" \
                 -e "s/GROUP=\"sgx\", //" rules.d/50-udev-default.rules.in
          mkdir -p build
          cd build
          meson setup \
            --prefix=/usr                              \
            --buildtype=release                        \
            -D default-dnssec=no                       \
            -D firstboot=false                         \
            -D install-tests=false                     \
            -D ldconfig=false                          \
            -D man=auto                                \
            -D sysusers=false                          \
            -D rpmmacrosdir=no                         \
            -D homed=disabled                          \
            -D userdb=false                            \
            -D mode=release                            \
            -D pam=disabled                            \
            -D dev-kvm-mode=0660                       \
            -D nobody-group=nogroup                    \
            -D sysupdate=disabled                      \
            -D ukify=disabled                          \
            -D docdir=/usr/share/doc/systemd-257.3     \
            ..
          ninja
          ninja install
        '

    - name: 0002 - Systemd Man Pages (Systemd Integration)
      version: 257.3
      archive_file: /mnt/lfs/sources/systemd-man-pages-257.3.tar.xz
      source_dir: /mnt/lfs/sources
      description: |
        This job installs the pre-built systemd man pages, providing documentation
        for systemd commands and configuration files.
      category:
        This job is part of the systemd integration, specifically for installing systemd man pages.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          tar -xf /sources/systemd-man-pages-257.3.tar.xz \
              --strip-components=1 -C /usr/share/man
        '

    - name: 0003 - Configure Systemd Journald (Systemd Integration)
      version: 1.0
      archive_file: /mnt/lfs/sources/empty.tar.xz
      source_dir: /mnt/lfs/sources
      description: |
        This job configures systemd-journald for persistent log storage with
        sensible size limits on the LFS system.
      category:
        This job is part of the systemd integration, specifically for configuring journald.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          mkdir -p /var/log/journal
          systemd-tmpfiles --create --prefix /var/log/journal
          cat > /etc/systemd/journald.conf << "EOF"
          [Journal]
          Storage=persistent
          Compress=yes
          SystemMaxUse=500M
          SystemKeepFree=100M
          MaxRetentionSec=1month
          ForwardToSyslog=no
          EOF
        '

    - name: 0004 - Configure Systemd Networkd (Systemd Integration)
      version: 1.0
      archive_file: /mnt/lfs/sources/empty.tar.xz
      source_dir: /mnt/lfs/sources
      description: |
        This job configures systemd-networkd for basic wired DHCP networking on
        all Ethernet interfaces, and links resolv.conf to systemd-resolved.
      category:
        This job is part of the systemd integration, specifically for configuring networkd.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          mkdir -p /etc/systemd/network
          cat > /etc/systemd/network/20-wired-dhcp.network << "EOF"
          [Match]
          Name=en*

          [Network]
          DHCP=yes
          EOF
          ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          systemctl enable systemd-networkd
          systemctl enable systemd-resolved
        '

    - name: 0005 - Enable Essential Systemd Services (Systemd Integration)
      version: 1.0
      archive_file: /mnt/lfs/sources/empty.tar.xz
      source_dir: /mnt/lfs/sources
      description: |
        This job enables the essential systemd units required for booting the LFS
        system: getty@tty1, udevd, journald, tmpfiles, and sets the default target
        to multi-user.target.
      category:
        This job is part of the systemd integration, specifically for enabling essential services.
      exec_command: echo
      build_tool: true
      build_command: |
        {{ chroot_start_command }} -c '
          systemctl enable getty@tty1
          systemctl enable systemd-udevd
          systemctl enable systemd-journald
          systemctl enable systemd-tmpfiles-setup
          systemctl enable systemd-tmpfiles-clean.timer
          systemctl set-default multi-user.target
        '



